name: Numerical reproducibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify notebook JSON and code structure
        run: |
          python -m pip install nbformat
          python -c "import nbformat, pathlib; [nbformat.validate(nbformat.read(str(p), as_version=4)) for p in pathlib.Path('notebooks').glob('*.ipynb')]"
      - name: Recalculate metrics and verify sources
        run: python scripts/validation/verify_release.py --root .
      - name: Reproduce saved generalization diagnostics
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python scripts/validation/verify_release.py --root . --full
