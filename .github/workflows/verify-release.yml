name: Numerical reproducibility
on:
  push:
    branches: [main, 'revision-*']
  pull_request:
  workflow_dispatch:
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify notebook JSON and code structure
        run: |
          python -m pip install nbformat jupyter_client ipykernel nbconvert
          python -c "import nbformat, pathlib; [nbformat.validate(nbformat.read(str(p), as_version=4)) for p in sorted(pathlib.Path('notebooks').glob('*.ipynb'))]"
      - name: Execute read-only notebooks
        run: |
          for nb in notebooks/*.ipynb; do
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=180 --stdout "$nb" > /dev/null
          done
      - name: Recalculate metrics and verify sources
        run: python scripts/validation/verify_release.py --root .
      - name: Verify V4 revision source freeze and CPU reproduction
        run: python scripts/validation/verify_revision.py --root .
      - name: Reproduce saved generalization diagnostics
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python scripts/validation/verify_release.py --root . --full
